name: Release DMG

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.17. Leave empty to use the current plist version."
        required: false
        type: string
      build_number:
        description: "Build number. Leave empty to use the GitHub run number."
        required: false
        type: string
      publish_release:
        description: "Publish a GitHub Release for manual runs."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install release dependencies
        run: |
          brew update
          brew install create-dmg sqlcipher

      - name: Resolve release metadata
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number || '' }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH_GITHUB_RELEASE="true"
          else
            RELEASE_VERSION="$INPUT_VERSION"
            PUBLISH_GITHUB_RELEASE="$INPUT_PUBLISH_RELEASE"
          fi
          RELEASE_MODE="distribution"

          RELEASE_BUILD_NUMBER="${INPUT_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"

          if [[ "$PUBLISH_GITHUB_RELEASE" == "true" && -z "$RELEASE_VERSION" ]]; then
            echo "Manual release publishing requires the version input." >&2
            exit 1
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_NUMBER=$RELEASE_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_MODE=$RELEASE_MODE" >> "$GITHUB_ENV"
          echo "PUBLISH_GITHUB_RELEASE=$PUBLISH_GITHUB_RELEASE" >> "$GITHUB_ENV"

          echo "Release mode: $RELEASE_MODE"
          echo "Release version: ${RELEASE_VERSION:-current plist}"
          echo "Build number: $RELEASE_BUILD_NUMBER"

      - name: Apply release version
        if: env.RELEASE_VERSION != ''
        run: ./scripts/set_app_version.sh "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"

      - name: Resolve signing mode
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          LEGACY_APPLE_DEV_CERT_P12_BASE64: ${{ secrets.APPLE_DEV_CERT_P12_BASE64 }}
          LEGACY_APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          LEGACY_APPLE_DEV_SIGNING_IDENTITY: ${{ secrets.APPLE_DEV_SIGNING_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID || secrets.ASC_API_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID || secrets.ASC_API_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 || secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_SUBJECT: ${{ secrets.APPLE_NOTARY_KEY_SUBJECT || secrets.ASC_API_KEY_SUBJECT }}
        run: |
          CERT_P12_BASE64="${MACOS_CERT_P12_BASE64:-${LEGACY_APPLE_DEV_CERT_P12_BASE64:-}}"
          CERT_PASSWORD="${MACOS_CERT_PASSWORD:-${LEGACY_APPLE_DEV_CERT_PASSWORD:-}}"
          SIGNING_NAME="${MACOS_SIGNING_IDENTITY:-${LEGACY_APPLE_DEV_SIGNING_IDENTITY:-}}"

          if [[ -n "${CERT_P12_BASE64:-}" && -n "${CERT_PASSWORD:-}" && -n "${SIGNING_NAME:-}" ]]; then
            echo "HAS_SIGNING_SECRETS=true" >> "$GITHUB_ENV"
            echo "SIGNING_IDENTITY=${SIGNING_NAME}" >> "$GITHUB_ENV"
            echo "ENABLE_HARDENED_RUNTIME=1" >> "$GITHUB_ENV"
            echo "Signing with configured macOS identity from secrets."
          else
            echo "Distribution DMG releases require MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, and MACOS_SIGNING_IDENTITY." >&2
            exit 1
          fi

          if [[ "$SIGNING_NAME" != Developer\ ID\ Application:* ]]; then
            echo "Distribution DMG releases require MACOS_SIGNING_IDENTITY to be a Developer ID Application identity." >&2
            echo "Current identity: ${SIGNING_NAME:-unset}" >&2
            exit 1
          fi

          if [[ -n "${APPLE_NOTARY_APPLE_ID:-}" && -n "${APPLE_NOTARY_PASSWORD:-}" && -n "${APPLE_NOTARY_TEAM_ID:-}" ]]; then
            echo "NOTARIZE_DMG=1" >> "$GITHUB_ENV"
            echo "Notarization Apple ID credentials detected; DMG will be submitted to Apple."
          elif [[ -n "${APPLE_NOTARY_KEY_ID:-}" && -n "${APPLE_NOTARY_KEY_P8_BASE64:-}" ]]; then
            echo "NOTARIZE_DMG=1" >> "$GITHUB_ENV"
            echo "APPLE_NOTARY_KEY_ID=${APPLE_NOTARY_KEY_ID}" >> "$GITHUB_ENV"
            echo "APPLE_NOTARY_ISSUER_ID=${APPLE_NOTARY_ISSUER_ID}" >> "$GITHUB_ENV"
            echo "APPLE_NOTARY_KEY_SUBJECT=${APPLE_NOTARY_KEY_SUBJECT}" >> "$GITHUB_ENV"
            echo "Notarization API key credentials detected; DMG will be submitted to Apple."
          else
            echo "Distribution DMG releases require notarization credentials." >&2
            echo "Set APPLE_NOTARY_APPLE_ID + APPLE_NOTARY_PASSWORD + APPLE_NOTARY_TEAM_ID, or APPLE_NOTARY_KEY_ID + APPLE_NOTARY_KEY_P8_BASE64." >&2
            exit 1
          fi

      - name: Prepare notary API key
        if: env.NOTARIZE_DMG == '1' && env.APPLE_NOTARY_KEY_ID != ''
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 || secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          KEY_DIR="$RUNNER_TEMP/notary-private-keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          echo "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Import macOS signing certificate
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          LEGACY_APPLE_DEV_CERT_P12_BASE64: ${{ secrets.APPLE_DEV_CERT_P12_BASE64 }}
          LEGACY_APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/minutewave-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/macos-signing-cert.p12"
          CERT_P12_BASE64="${MACOS_CERT_P12_BASE64:-${LEGACY_APPLE_DEV_CERT_P12_BASE64:-}}"
          CERT_PASSWORD="${MACOS_CERT_PASSWORD:-${LEGACY_APPLE_DEV_CERT_PASSWORD:-}}"

          echo "$CERT_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build DMG
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          echo "Building DMG with signing identity: ${SIGNING_IDENTITY}"
          SIGNING_IDENTITY="$SIGNING_IDENTITY" \
            ENABLE_HARDENED_RUNTIME="$ENABLE_HARDENED_RUNTIME" \
            NOTARIZE_DMG="$NOTARIZE_DMG" \
            APPLE_NOTARY_APPLE_ID="$APPLE_NOTARY_APPLE_ID" \
            APPLE_NOTARY_PASSWORD="$APPLE_NOTARY_PASSWORD" \
            APPLE_NOTARY_TEAM_ID="$APPLE_NOTARY_TEAM_ID" \
            APPLE_NOTARY_KEY_ID="$APPLE_NOTARY_KEY_ID" \
            APPLE_NOTARY_ISSUER_ID="$APPLE_NOTARY_ISSUER_ID" \
            APPLE_NOTARY_KEY_PATH="$APPLE_NOTARY_KEY_PATH" \
            APPLE_NOTARY_KEY_SUBJECT="$APPLE_NOTARY_KEY_SUBJECT" \
            ./scripts/build_dmg.sh release

      - name: Verify app signature
        run: |
          if [[ "${HAS_SIGNING_SECRETS}" == "true" ]]; then
            codesign -dv --verbose=4 .build/AppBundle/MinuteWave.app 2>&1 | grep -E "Authority=|TeamIdentifier=|Signature="
          else
            codesign -dv --verbose=4 .build/AppBundle/MinuteWave.app 2>&1 | grep -E "Signature="
          fi
          codesign --verify --deep --strict .build/AppBundle/MinuteWave.app
          if [[ "${HAS_SIGNING_SECRETS}" == "true" ]]; then
            codesign -d --entitlements :- .build/AppBundle/MinuteWave.app
          fi

      - name: Verify DMG notarization
        if: env.NOTARIZE_DMG == '1'
        run: |
          xcrun stapler validate dist/MinuteWave-macOS.dmg
          spctl -a -vv -t open --context context:primary-signature dist/MinuteWave-macOS.dmg

      - name: Run release doctor
        run: |
          STRICT_DISTRIBUTION="$([[ "$RELEASE_MODE" == "distribution" ]] && echo 1 || echo 0)" \
            SIGNING_IDENTITY="$SIGNING_IDENTITY" \
            NOTARIZE_DMG="$NOTARIZE_DMG" \
            APPLE_NOTARY_APPLE_ID="${{ secrets.APPLE_NOTARY_APPLE_ID }}" \
            APPLE_NOTARY_PASSWORD="${{ secrets.APPLE_NOTARY_PASSWORD }}" \
            APPLE_NOTARY_TEAM_ID="${{ secrets.APPLE_NOTARY_TEAM_ID }}" \
            APPLE_NOTARY_KEY_ID="$APPLE_NOTARY_KEY_ID" \
            APPLE_NOTARY_ISSUER_ID="$APPLE_NOTARY_ISSUER_ID" \
            APPLE_NOTARY_KEY_PATH="$APPLE_NOTARY_KEY_PATH" \
            APPLE_NOTARY_KEY_SUBJECT="$APPLE_NOTARY_KEY_SUBJECT" \
            ./scripts/release_doctor.sh

      - name: Generate SHA256
        run: |
          shasum -a 256 dist/MinuteWave-macOS.dmg > dist/MinuteWave-macOS.dmg.sha256

      - name: Publish GitHub Release
        if: env.PUBLISH_GITHUB_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.RELEASE_VERSION) }}
          files: |
            dist/MinuteWave-macOS.dmg
            dist/MinuteWave-macOS.dmg.sha256
          generate_release_notes: true
          body: |
            ## MinuteWave release

            - macOS DMG build
            - Developer ID signed
            - Notarized and stapled
            - Version: ${{ env.RELEASE_VERSION || 'plist version' }}
