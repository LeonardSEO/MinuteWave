name: TestFlight Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version, for example 0.1.17."
        required: true
        type: string
      build_number:
        description: "Build number. Leave empty to use the GitHub run number."
        required: false
        type: string
      upload:
        description: "Upload to App Store Connect/TestFlight after validation."
        required: true
        default: false
        type: boolean
      validate:
        description: "Validate with App Store Connect. Requires App Store Connect credentials."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcrun altool --help | sed -n '1,25p'

      - name: Install build dependencies
        run: |
          brew update
          brew install sqlcipher

      - name: Import App Store certificates
        env:
          MAC_APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.MAC_APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          MAC_APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.MAC_APPLE_DISTRIBUTION_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_CER_BASE64: ${{ secrets.MAC_INSTALLER_CERT_CER_BASE64 }}
        run: |
          if [[ -z "${MAC_APPLE_DISTRIBUTION_CERT_P12_BASE64:-}" || -z "${MAC_APPLE_DISTRIBUTION_CERT_PASSWORD:-}" ]]; then
            echo "Missing MAC_APPLE_DISTRIBUTION_CERT_P12_BASE64 or MAC_APPLE_DISTRIBUTION_CERT_PASSWORD." >&2
            exit 1
          fi
          if [[ -z "${MAC_INSTALLER_CERT_P12_BASE64:-}" && -z "${MAC_INSTALLER_CERT_CER_BASE64:-}" ]]; then
            echo "Missing MAC_INSTALLER_CERT_P12_BASE64 or MAC_INSTALLER_CERT_CER_BASE64." >&2
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/minutewave-testflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          APP_CERT_PATH="$RUNNER_TEMP/apple-distribution.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/mac-installer.p12"
          INSTALLER_CER_PATH="$RUNNER_TEMP/mac-installer.cer"

          echo "$MAC_APPLE_DISTRIBUTION_CERT_P12_BASE64" | base64 -D > "$APP_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_APPLE_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security -f pkcs12

          if [[ -n "${MAC_INSTALLER_CERT_P12_BASE64:-}" ]]; then
            if [[ -z "${MAC_INSTALLER_CERT_PASSWORD:-}" ]]; then
              echo "Missing MAC_INSTALLER_CERT_PASSWORD for MAC_INSTALLER_CERT_P12_BASE64." >&2
              exit 1
            fi
            echo "$MAC_INSTALLER_CERT_P12_BASE64" | base64 -D > "$INSTALLER_CERT_PATH"
            security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security -f pkcs12
          fi

          if [[ -n "${MAC_INSTALLER_CERT_CER_BASE64:-}" ]]; then
            echo "$MAC_INSTALLER_CERT_CER_BASE64" | base64 -D > "$INSTALLER_CER_PATH"
            security import "$INSTALLER_CER_PATH" -k "$KEYCHAIN_PATH" -T /usr/bin/productbuild -T /usr/bin/security
          fi

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [[ -z "${ASC_API_KEY_ID:-}" || -z "${ASC_API_KEY_P8_BASE64:-}" ]]; then
            echo "No ASC API key file secret configured; falling back to username/password auth if present."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "ASC_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Apply app version
        run: ./scripts/set_app_version.sh "${{ inputs.version }}" "${{ inputs.build_number || github.run_number }}"

      - name: Build TestFlight package
        env:
          APPLE_DISTRIBUTION_SIGNING_IDENTITY: ${{ secrets.MAC_APPLE_DISTRIBUTION_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MAC_INSTALLER_SIGNING_IDENTITY }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_USERNAME: ${{ secrets.ASC_USERNAME }}
          ASC_PASSWORD: ${{ secrets.ASC_PASSWORD }}
          ASC_PROVIDER_PUBLIC_ID: ${{ secrets.ASC_PROVIDER_PUBLIC_ID }}
          VALIDATE_TESTFLIGHT: ${{ (inputs.validate || inputs.upload) && '1' || '0' }}
          UPLOAD_TESTFLIGHT: ${{ inputs.upload && '1' || '0' }}
        run: ./scripts/build_testflight_pkg.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinuteWave-macOS-TestFlight-pkg
          path: dist/MinuteWave-macOS-TestFlight.pkg
